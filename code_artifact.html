<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라임 릴레이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col bg-slate-50 selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">
                        라임 릴레이
                    </h1>
                    <p class="text-xs text-slate-500 font-medium">실시간 초성 & 모음 글짓기</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- URL Copy Button for Sharing -->
                <button onclick="copyCurrentAppUrl()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-xs font-bold transition-all border border-indigo-200 flex items-center gap-1.5 shadow-sm" title="학생들에게 전달할 공유 링크 복사">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>학생 공유 링크 복사</span>
                </button>

                <!-- Role Switcher -->
                <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200">
                    <button id="btn-mode-student" onclick="switchRole('student')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 bg-white text-indigo-600 shadow-sm">
                        <i class="fa-solid fa-user-graduate mr-1.5"></i>학생 화면
                    </button>
                    <button id="btn-mode-teacher" onclick="openTeacherAuthModal()" class="px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all duration-200">
                        <i class="fa-solid fa-chalkboard-user mr-1.5"></i>선생님 화면
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">

        <section id="teacher-view" class="hidden space-y-6">
            <!-- Topic Creation Box -->
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center">
                        <i class="fa-solid fa-plus-circle text-indigo-600 mr-2 text-xl"></i>새 라임 주제 제시하기
                    </h2>
                    <button onclick="changeTeacherPassword()" class="text-xs text-slate-400 hover:text-indigo-600 transition-colors flex items-center gap-1">
                        <i class="fa-solid fa-key"></i>비밀번호 변경
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div class="md:col-span-1">
                        <label class="block text-xs font-semibold text-slate-500 mb-1">라임 유형</label>
                        <select id="topic-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="초성">초성 (예: ㄱㄴ, ㄹㅁ)</option>
                            <option value="모음">모음 (예: ㅏㅓ, ㅗㅜ)</option>
                            <option value="자유">자유 라임</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-500 mb-1">제시어 / 라임 키워드</label>
                        <input type="text" id="topic-title" placeholder="예: ㄱㄴ (가방, 나무) / ㅏㅏ (바다, 사자)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="md:col-span-1 flex items-end">
                        <button onclick="createNewTopic()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-2.5 px-4 rounded-xl shadow-md shadow-indigo-100 transition-all duration-200 flex items-center justify-center text-sm">
                            <i class="fa-solid fa-paper-plane mr-2"></i>학생들에게 발송
                        </button>
                    </div>
                </div>
            </div>

            <!-- Dashboard / Live Submissions Header -->
            <div class="flex justify-between items-end pt-2 border-b border-slate-200 pb-3">
                <div>
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-600"></i>라임 주제별 기록
                    </h3>
                    <p class="text-xs text-slate-500">선생님이 제시한 모든 주제와 학생들의 제출 기록입니다.</p>
                </div>
                <div>
                    <button onclick="clearAllData()" class="text-xs text-rose-500 hover:text-rose-600 hover:bg-rose-50 border border-rose-200 px-3 py-1.5 rounded-xl transition-colors">
                        <i class="fa-solid fa-trash-can mr-1.5"></i>전체 데이터 초기화
                    </button>
                </div>
            </div>

            <!-- Grouped by Topic Card Container -->
            <div id="teacher-topics-container" class="space-y-6">
                <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200">
                    <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500 mb-2"></i>
                    <p class="text-slate-500 text-sm font-medium">데이터를 불러오는 중...</p>
                </div>
            </div>
        </section>

        <section id="student-view" class="space-y-6 max-w-6xl mx-auto">
            <!-- Responsive Grid for Tablet Landscape / Desktop (2 columns) -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                
                <!-- Left Side: Real-time All Submissions Feed (7 cols on md/lg) -->
                <div class="md:col-span-7 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 order-2 md:order-1 min-h-[520px] flex flex-col">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                        <h4 class="text-base font-bold text-slate-800 flex items-center">
                            <i class="fa-solid fa-comments text-indigo-600 mr-2 text-lg"></i>실시간 전체 라임 릴레이
                        </h4>
                        <span id="all-submissions-count" class="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full">0개</span>
                    </div>
                    <div id="student-all-submissions" class="space-y-2.5 max-h-[440px] overflow-y-auto pr-1 flex-grow">
                        <p class="text-xs text-slate-400 text-center py-16 font-medium">아직 제출된 문장이 없습니다.<br>오른쪽에서 첫 문장을 작성해보세요!</p>
                    </div>
                </div>

                <!-- Right Side: Student Info & Submission Input Card (5 cols on md/lg) -->
                <div class="md:col-span-5 space-y-4 order-1 md:order-2 sticky top-20">
                    <!-- Student Info Input -->
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                        <label class="block text-xs font-bold text-slate-600 mb-2 flex items-center">
                            <i class="fa-solid fa-id-badge text-indigo-600 mr-1.5"></i>랩네임
                        </label>
                        <input type="text" id="student-name" placeholder="랩네임을 입력하세요 (예: MC철수)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <!-- Active Topic View & Submission Form -->
                    <div id="student-active-topic-card" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                        <div id="student-topic-display" class="p-4 bg-indigo-50/70 rounded-xl border border-indigo-100 text-center">
                            <span id="student-topic-badge" class="inline-block px-2.5 py-0.5 bg-indigo-600 text-white font-bold text-[11px] rounded-md mb-2">
                                현재 라임
                            </span>
                            <h3 id="student-topic-text" class="text-2xl font-black text-indigo-950 leading-tight">
                                대기 중...
                            </h3>
                            <p class="text-xs text-slate-500 mt-1 font-medium">선생님이 라임 주제를 제시할 때까지 기다려 주세요!</p>
                        </div>

                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-2 flex items-center">
                                    <i class="fa-solid fa-pen text-indigo-600 mr-1.5"></i>라임 문장 작성
                                </label>
                                <textarea id="student-sentence" rows="4" placeholder="선생님이 제시한 라임에 맞춰 한 문장을 적어보세요!" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none leading-relaxed"></textarea>
                            </div>
                            <button onclick="submitStudentSentence()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-100 transition-all duration-200 flex items-center justify-center text-sm">
                                <i class="fa-solid fa-paper-plane mr-2"></i>선생님께 제출하기
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <div id="teacher-auth-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-100">
            <div class="text-center mb-5">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900">선생님 인증</h3>
                <p class="text-xs text-slate-500 mt-1">선생님 비밀번호를 입력하세요.<br><span class="text-indigo-600 font-semibold">(초기 비밀번호: 1234)</span></p>
            </div>
            <input type="password" id="teacher-password-input" placeholder="비밀번호" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-center text-lg font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-4" onkeypress="if(event.key==='Enter') verifyTeacherPassword()">
            <div class="flex gap-2">
                <button onclick="closeTeacherAuthModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-xl text-xs transition-colors">취소</button>
                <button onclick="verifyTeacherPassword()" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition-colors shadow-md shadow-indigo-100">확인</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2 z-50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message" class="text-sm font-medium">알림 메시지</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rhyme-relay-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-app.firebaseapp.com",
            projectId: "demo-app",
            storageBucket: "demo-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentRole = 'student';
        let teacherPassword = localStorage.getItem('teacher_password') || '1234';
        let topicsData = [];
        let submissionsData = [];

        const getTopicsRef = () => collection(db, 'artifacts', appId, 'public', 'data', 'topics');
        const getSubmissionsRef = () => collection(db, 'artifacts', appId, 'public', 'data', 'submissions');

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth failed:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                subscribeToData();
            }
        });

        function subscribeToData() {
            if (!currentUser) return;

            onSnapshot(getTopicsRef(), (snapshot) => {
                topicsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                topicsData.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderUI();
            }, (error) => console.error("Topics listen error:", error));

            onSnapshot(getSubmissionsRef(), (snapshot) => {
                submissionsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                submissionsData.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderUI();
            }, (error) => console.error("Submissions listen error:", error));
        }

        // Modal Handlers
        window.openTeacherAuthModal = function() {
            if (currentRole === 'teacher') return;
            document.getElementById('teacher-password-input').value = '';
            document.getElementById('teacher-auth-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('teacher-password-input').focus(), 100);
        };

        window.closeTeacherAuthModal = function() {
            document.getElementById('teacher-auth-modal').classList.add('hidden');
        };

        window.verifyTeacherPassword = function() {
            const inputPw = document.getElementById('teacher-password-input').value;
            if (inputPw === teacherPassword) {
                closeTeacherAuthModal();
                switchRole('teacher');
                showToast("선생님 화면으로 전환되었습니다.");
            } else {
                showToast("비밀번호가 올바르지 않습니다!", "error");
            }
        };

        window.changeTeacherPassword = function() {
            const current = prompt("현재 비밀번호를 입력하세요:");
            if (current !== teacherPassword) {
                if (current !== null) showToast("비밀번호가 틀렸습니다.", "error");
                return;
            }
            const newPw = prompt("새로운 비밀번호를 입력하세요:");
            if (newPw && newPw.trim()) {
                teacherPassword = newPw.trim();
                localStorage.setItem('teacher_password', teacherPassword);
                showToast("비밀번호가 변경되었습니다.");
            }
        };

        window.switchRole = function(role) {
            currentRole = role;
            const btnTeacher = document.getElementById('btn-mode-teacher');
            const btnStudent = document.getElementById('btn-mode-student');
            const teacherView = document.getElementById('teacher-view');
            const studentView = document.getElementById('student-view');

            if (role === 'teacher') {
                btnTeacher.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 bg-white text-indigo-600 shadow-sm";
                btnTeacher.innerHTML = `<i class="fa-solid fa-chalkboard-user mr-1.5"></i>선생님 화면`;
                btnStudent.className = "px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all duration-200";
                teacherView.classList.remove('hidden');
                studentView.classList.add('hidden');
            } else {
                btnStudent.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 bg-white text-indigo-600 shadow-sm";
                btnTeacher.className = "px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600 hover:text-slate-900 transition-all duration-200";
                btnTeacher.innerHTML = `<i class="fa-solid fa-lock mr-1.5"></i>선생님 화면`;
                studentView.classList.remove('hidden');
                teacherView.classList.add('hidden');
            }
            renderUI();
        };

        function renderUI() {
            if (currentRole === 'teacher') {
                renderTeacherDashboard();
            } else {
                renderStudentView();
            }
        }

        function renderTeacherDashboard() {
            const container = document.getElementById('teacher-topics-container');
            if (topicsData.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200">
                        <i class="fa-solid fa-pen-nib text-3xl text-indigo-400 mb-2"></i>
                        <p class="text-slate-700 font-bold text-base mb-1">등록된 라임 주제가 없습니다.</p>
                        <p class="text-xs text-slate-400">상단 제시 창에서 학생들에게 발송할 첫 번째 라임을 등록하세요.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            topicsData.forEach((topic) => {
                const topicSubmissions = submissionsData.filter(s => s.topicId === topic.id);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden";

                card.innerHTML = `
                    <div class="bg-slate-50/80 px-6 py-3.5 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                        <div class="flex items-center space-x-3">
                            <span class="px-2.5 py-0.5 bg-indigo-100 text-indigo-700 font-bold text-xs rounded-md">${topic.type}</span>
                            <h4 class="text-lg font-bold text-slate-800">${escapeHtml(topic.title)}</h4>
                            <span class="text-xs text-slate-400 font-medium">(${topicSubmissions.length}개 제출)</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="copyTopicSubmissions('${topic.id}')" class="px-3 py-1.5 bg-white hover:bg-slate-100 border border-slate-200 text-indigo-600 rounded-xl text-xs font-semibold transition-colors flex items-center">
                                <i class="fa-regular fa-copy mr-1.5"></i>이 라임 문장 전체 복사
                            </button>
                            <button onclick="deleteTopic('${topic.id}')" class="px-2.5 py-1.5 text-slate-400 hover:text-rose-500 transition-colors" title="주제 삭제">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-6">
                        ${topicSubmissions.length === 0 ? 
                            `<p class="text-xs text-slate-400 text-center py-4 font-medium">아직 제출된 문장이 없습니다.</p>` :
                            `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                ${topicSubmissions.map(sub => `
                                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-3.5 relative group hover:border-slate-300 transition-all">
                                        <div class="flex justify-between items-start mb-1">
                                            <span class="font-bold text-xs text-indigo-600 flex items-center">
                                                <i class="fa-solid fa-user mr-1.5 text-[10px]"></i>${escapeHtml(sub.studentName)}
                                            </span>
                                            <button onclick="deleteSubmission('${sub.id}')" class="text-slate-400 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity text-xs" title="삭제">
                                                <i class="fa-solid fa-xmark"></i>
                                            </button>
                                        </div>
                                        <p class="text-sm text-slate-700 font-medium leading-relaxed break-keep">"${escapeHtml(sub.sentence)}"</p>
                                    </div>
                                `).join('')}
                            </div>`
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderStudentView() {
            const activeTopicText = document.getElementById('student-topic-text');
            const activeTopicBadge = document.getElementById('student-topic-badge');

            let currentTopic = null;
            if (topicsData.length > 0) {
                currentTopic = topicsData[0];
                activeTopicText.textContent = currentTopic.title;
                activeTopicBadge.textContent = `${currentTopic.type} 라임`;
            } else {
                activeTopicText.textContent = "대기 중...";
                activeTopicBadge.textContent = "대기 중";
            }

            const allSubmissionsContainer = document.getElementById('student-all-submissions');
            const countBadge = document.getElementById('all-submissions-count');
            const studentName = document.getElementById('student-name').value.trim();

            if (!currentTopic) {
                allSubmissionsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-16 font-medium">진행 중인 라임 주제가 없습니다.</p>`;
                countBadge.textContent = '0개';
                return;
            }

            const currentTopicSubmissions = submissionsData.filter(s => s.topicId === currentTopic.id);
            countBadge.textContent = `${currentTopicSubmissions.length}개`;

            if (currentTopicSubmissions.length === 0) {
                allSubmissionsContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-16 font-medium">아직 제출된 문장이 없습니다.<br>오른쪽에서 첫 문장을 작성해보세요!</p>`;
            } else {
                allSubmissionsContainer.innerHTML = currentTopicSubmissions.map(sub => {
                    const isMySubmission = studentName && sub.studentName === studentName;
                    return `
                        <div class="p-3.5 rounded-xl border ${isMySubmission ? 'bg-indigo-50/70 border-indigo-200' : 'bg-slate-50 border-slate-100'} flex justify-between items-start gap-2 transition-all">
                            <div class="flex-grow">
                                <div class="flex items-center space-x-2 mb-1">
                                    <span class="font-bold text-xs ${isMySubmission ? 'text-indigo-600' : 'text-slate-700'}">
                                        <i class="fa-solid fa-user mr-1.5 text-[10px]"></i>${escapeHtml(sub.studentName)}
                                    </span>
                                    ${isMySubmission ? '<span class="text-[10px] bg-indigo-600 text-white px-1.5 py-0.2 rounded font-bold">내 글</span>' : ''}
                                </div>
                                <p class="text-sm font-medium text-slate-800 leading-relaxed break-keep">"${escapeHtml(sub.sentence)}"</p>
                            </div>
                            ${isMySubmission ? `
                                <button onclick="deleteSubmission('${sub.id}')" class="text-xs text-slate-400 hover:text-rose-500 p-1" title="내 글 삭제">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }
        }

        window.createNewTopic = async function() {
            if (!currentUser) return;
            const type = document.getElementById('topic-type').value;
            const titleInput = document.getElementById('topic-title');
            const title = titleInput.value.trim();

            if (!title) {
                showToast("라임 제시어/키워드를 입력해주세요!", "warning");
                return;
            }

            try {
                await addDoc(getTopicsRef(), {
                    type: type,
                    title: title,
                    createdAt: Date.now(),
                    createdBy: currentUser.uid
                });

                titleInput.value = '';
                showToast("새 라임 주제가 발송되었습니다.");
            } catch (err) {
                console.error("Error creating topic:", err);
                showToast("발송 실패!", "error");
            }
        };

        window.submitStudentSentence = async function() {
            if (!currentUser) return;
            const nameInput = document.getElementById('student-name');
            const sentenceInput = document.getElementById('student-sentence');

            const studentName = nameInput.value.trim();
            const sentence = sentenceInput.value.trim();

            if (!studentName) {
                showToast("랩네임을 입력해 주세요!", "warning");
                nameInput.focus();
                return;
            }

            if (!sentence) {
                showToast("문장을 입력해 주세요!", "warning");
                sentenceInput.focus();
                return;
            }

            if (topicsData.length === 0) {
                showToast("현재 진행 중인 라임 주제가 없습니다.", "warning");
                return;
            }

            const currentTopic = topicsData[0];

            try {
                await addDoc(getSubmissionsRef(), {
                    topicId: currentTopic.id,
                    studentName: studentName,
                    sentence: sentence,
                    createdAt: Date.now(),
                    userId: currentUser.uid
                });
                sentenceInput.value = '';
                showToast("성공적으로 제출되었습니다!");
            } catch (err) {
                console.error("Error submitting sentence:", err);
                showToast("제출 실패! 다시 시도해주세요.", "error");
            }
        };

        window.copyTopicSubmissions = function(topicId) {
            const topic = topicsData.find(t => t.id === topicId);
            if (!topic) return;

            const topicSubmissions = submissionsData.filter(s => s.topicId === topicId);
            if (topicSubmissions.length === 0) {
                showToast("복사할 문장이 없습니다.", "warning");
                return;
            }

            let textToCopy = `[라임 주제: ${topic.title}]\n`;
            textToCopy += topicSubmissions.map((s, idx) => `${idx + 1}. [${s.studentName}] ${s.sentence}`).join('\n');

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast("클립보드에 문장 전체가 복사되었습니다!");
            } catch (err) {
                showToast("복사 실패!", "error");
            } finally {
                document.body.removeChild(textarea);
            }
        };

        window.deleteTopic = async function(topicId) {
            if (!currentUser) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'topics', topicId));
                showToast("주제가 삭제되었습니다.");
            } catch (err) {
                console.error("Error deleting topic:", err);
            }
        };

        window.deleteSubmission = async function(submissionId) {
            if (!currentUser) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'submissions', submissionId));
                showToast("문장이 삭제되었습니다.");
            } catch (err) {
                console.error("Error deleting submission:", err);
            }
        };

        window.clearAllData = async function() {
            if (!currentUser) return;
            if (!confirm("모든 라임 주제와 학생 제출 기록을 초기화하시겠습니까?")) return;
            try {
                const topicDocs = await getDocs(getTopicsRef());
                topicDocs.forEach(async (d) => await deleteDoc(d.ref));

                const subDocs = await getDocs(getSubmissionsRef());
                subDocs.forEach(async (d) => await deleteDoc(d.ref));

                showToast("모든 데이터가 초기화되었습니다.");
            } catch (err) {
                console.error("Clear data error:", err);
            }
        };

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;

            if (type === "warning") {
                toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-xmark text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Copy Direct Link Function
        window.copyCurrentAppUrl = function() {
            const currentUrl = window.location.href;
            
            const textarea = document.createElement('textarea');
            textarea.value = currentUrl;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast("학생들에게 공유할 링크가 복사되었습니다!");
            } catch (err) {
                showToast("링크 복사에 실패했습니다.", "error");
            } finally {
                document.body.removeChild(textarea);
            }
        };

        window.onload = () => {
            initAuth();
            document.getElementById('student-name').addEventListener('input', () => {
                if (currentRole === 'student') renderStudentView();
            });
        };
    </script>
</body>
</html>
